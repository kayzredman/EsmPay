function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600);}
function seeded(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function bars(vals,labels,h=160,color='#0b6b53',hi=-1){
  const w=vals.length*58+16,mx=Math.max(...vals)*1.18;
  return `<svg viewBox="0 0 ${w} ${h+28}" width="100%">${vals.map((v,i)=>{const bh=v/mx*h,x=10+i*58;
   return `<rect x="${x}" y="${h-bh}" width="40" height="${bh}" rx="7" fill="${i===hi?'#f2a900':color}"/>
   <text x="${x+20}" y="${h-bh-6}" text-anchor="middle" font-size="11" fill="#5b6f67">${v}</text>
   <text x="${x+20}" y="${h+18}" text-anchor="middle" font-size="11" fill="#5b6f67">${labels[i]}</text>`}).join('')}</svg>`;}
function donut(parts,size=150){const r=54,c=2*Math.PI*r,tot=parts.reduce((a,p)=>a+p.v,0);let off=0;
  return `<svg viewBox="0 0 150 150" width="${size}" height="${size}"><g transform="rotate(-90 75 75)">${parts.map(p=>{const len=p.v/tot*c;const s=`<circle cx="75" cy="75" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"/>`;off+=len;return s;}).join('')}</g></svg>`;}

function msgStats(){
  const m=ui.msg, body=m.body, uc=!/^[\x00-\x7F\u00a3\u20ac\u00a5]*$/.test(body), len=body.length;
  const segs=len===0?0:len<=(uc?70:160)?1:Math.ceil(len/(uc?67:153));
  let n=AUD[m.aud][1]; if(m.aud==='absent'&&D.attSaved) n=D.attAbsent.length||0;
  const {sms,wa,em}=m.ch; let cost=0;
  if(sms&&wa) cost=n*(0.7*0.03+0.3*segs*0.05); else if(sms) cost=n*segs*0.05; else if(wa) cost=n*0.03;
  const per=D.students[0]; const prev=body.replace(/\{\{student_first_name\}\}/g,'Ama').replace(/\{\{balance\}\}/g,'GHS 700.00').replace(/\{\{guardian_name\}\}/g,'Mrs. Mensah');
  return {n,segs,len,uc,cost,prev,any:sms||wa||em};
}

function updateMsg(){
  const S=msgStats(), short=S.cost>D.wallet;
  const c=$('#m-count'); if(!c) return;
  c.textContent=`${S.len} characters \u00b7 ${S.segs} SMS segment${S.segs===1?'':'s'}${S.uc?' (contains special characters \u2014 70 chars/segment)':''}`;
  $('#m-sum').innerHTML=`<div class="kv"><span>Recipients</span><b>${num(S.n)}</b></div><div class="kv"><span>Estimated cost</span><b>GHS ${S.cost.toFixed(2)}</b></div><div class="kv"><span>Wallet balance</span><b style="color:${short?'var(--danger)':'inherit'}">GHS ${D.wallet.toFixed(2)}</b></div>${short?'<div class="banner bad" style="margin:10px 0 0">Not enough credit. Top up your wallet or reduce the audience.</div>':''}${!S.any?'<div class="banner bad" style="margin:10px 0 0">Choose at least one channel.</div>':''}<p class="note" style="margin-top:10px">Parents who opted out of non-urgent messages are excluded automatically. One message per guardian even if they have several children.</p>`;

function after(){
  const sq=$('#sq'); if(sq) sq.oninput=()=>{ui.schoolQ=sq.value;$('#srows').innerHTML=schoolRows();};
  const fq=$('#fq'); if(fq) fq.oninput=()=>{ui.feeQ=fq.value;$('#irows').innerHTML=invRows();};
  const a=$('#m-aud'); if(a){ a.onchange=()=>{ui.msg.aud=a.value;if(a.value==='teachers'){ui.msg.ch={sms:false,wa:true,em:true};ui.msg.body='Dear colleagues, staff meeting is moved to 2pm on Friday in the staff room. - Head';}render();};
    $('#m-tpl').onchange=e=>{if(e.target.value){ui.msg.body=TPL[e.target.value];if(e.target.value==='close'){ui.msg.ch={sms:true,wa:true,em:true};}render();}};
    $('#m-body').oninput=e=>{ui.msg.body=e.target.value;updateMsg();}; updateMsg(); }
  seen=livePays().length+D.manual.length;
  if(ui.page==='flow'&&window.flowStart) flowStart();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-role],[data-page],[data-go],[data-act],[data-sf],[data-ff],[data-school],[data-stu],[data-att],[data-mch]'); if(!t) return;
  const d=t.dataset;
  if(d.role) return setRole(d.role);
  if(d.page){ui.page=d.page;render();return window.scrollTo(0,0);}
  if(d.go){const[r,p]=d.go.split(':');ui.role=r;ui.page=p;render();return window.scrollTo(0,0);}
  if(d.sf){ui.schoolFilter=d.sf;return render();}
  if(d.ff){ui.feeFilter=d.ff;return render();}
  if(d.school) return schoolDrawer(+d.school);
  if(d.stu) return stuDrawer(+d.stu);
  if(d.att){const[i,v]=d.att.split(':');D.students[+i].att_today=v;return render();}
  if(d.mch){ui.msg.ch[d.mch]=t.checked;return updateMsg();}
  if(d.act) act(d.act,d,t);
});

      <div class="field"><label>Method</label><select class="in" id="rp-m"><option>Cash</option><option>Bank</option><option>Cheque</option></select></div>
      <div class="field"><label>Reference (slip / cheque no.)</label><input class="in" id="rp-r" placeholder="optional"></div>
      <div class="acts"><button class="btn line" data-act="close">Cancel</button><button class="btn" data-act="savePay">Post payment</button></div>`);}
   case 'savePay':{const sid=+$('#rp-s').value,amt=Math.round(parseFloat($('#rp-a').value)*100),s=D.students[sid];
      if(!(amt>0)) return toast('Enter a valid amount'); if(amt>bal(s)) return toast(`Amount exceeds balance (${fm(bal(s))})`);
      const rc='GHA-R-'+String(D.receiptNo++).padStart(6,'0'); D.manual.push({sid,amount:amt,method:$('#rp-m').value,ref:$('#rp-r').value,receipt:rc,ts:Date.now()});
      closeOv();render();return toast(`${rc} posted \u00b7 receipt sent to ${s.guardian} (${s.phone})`);}
   case 'remind': return toast(`Reminder queued for ${D.students[id].guardian} via ${D.students[id].wa?'WhatsApp (SMS fallback)':'SMS'}`);
   case 'remindAll': return toast(`${D.students.filter(s=>bal(s)>0).length} reminders queued \u00b7 est. GHS ${(D.students.filter(s=>bal(s)>0).length*0.04).toFixed(2)}`);
   case 'receipt': return toast('Receipt PDF downloaded (demo)');
   case 'topup': return toast('MoMo prompt sent \u2014 wallet credited on approval (demo)');
   case 'reconFix':{const r=RECON.find(x=>x.id===id);r.done=true;r.ledger='Corrected \u00b7 '+fm(r.amt);P().exceptions=P().exceptions.filter(e=>e.ref!==r.ref);render();return toast('Ledger corrected via reversing entry + new posting (audited)');}
   case 'reconClaim':{const r=RECON.find(x=>x.id===id);r.done=true;r.who='Selorm Agbeko';r.ledger='Posted (claimed)';render();return toast('Payment assigned to Selorm Agbeko \u00b7 receipt sent');}
   case 'approveSub':{D.subs.find(s=>s.id===id).status='approved';render();return toast('Approved');}
   case 'returnSub':{const s=D.subs.find(x=>x.id===id);s.status='draft';if(s.live)D.returned=true;render();return toast(`${s.sub} returned to ${s.teacher}`);}
   case 'publish':{const ap=D.subs.filter(s=>s.status==='approved');ap.forEach(s=>s.status='published');
      const wa=D.students.filter(s=>s.wa).length,sms=24-wa;D.publishLog.push({subjects:ap.map(s=>s.sub),n:24,wa,sms,cost:wa*0.03+sms*0.05});render();return toast('Published \u00b7 guardians are being notified');}
   case 'sendMsg':{const S=msgStats();ui.msg.sending={step:0,p:0,del:0,fb:0,fail:0,cost:0};render();
      const tot=S.n,fb=Math.round(tot*0.05),fail=Math.round(tot*0.02);let tick=0;
      const iv=setInterval(()=>{tick++;const r=ui.msg.sending;r.p=Math.min(100,tick*12);r.step=tick<2?0:tick<4?1:tick<8?2:3;r.del=Math.min(tot-fail,Math.round(tot*tick*0.125));r.fb=Math.min(fb,Math.round(fb*tick/8));r.fail=Math.min(fail,Math.round(fail*tick/8));r.cost=S.cost*Math.min(1,tick/8);
        const m=$('#m-report'); if(m) m.innerHTML=reportHtml(); updateMsg();
        if(tick>=8){clearInterval(iv);r.step=4;r.p=100;r.del=tot-fail;D.wallet=Math.max(0,D.wallet-S.cost);D.msgHistory.unshift({when:'Just now',aud:AUD[ui.msg.aud][0],ch:Object.entries(ui.msg.ch).filter(x=>x[1]).map(x=>({wa:'WhatsApp',sms:'SMS',em:'Email'}[x[0]])).join(' + '),n:tot,ok:tot-fail,txt:ui.msg.body});if(ui.page==='msg')render();toast(`Sent to ${tot-fail} of ${tot} recipients`);}},400);return;}
   case 'schedule': return toast('Scheduled for tomorrow 07:30 (demo)');
   case 'csv': return toast('CSV import: 24 rows validated, 0 errors (demo)');
   case 'submitGrades':{const miss=D.students.filter(s=>tot(s)==null);
      if(miss.length) return modal(`<button class="x" data-act="close">\u00d7</button><h2>Can't submit yet</h2><p class="note" style="margin:6px 0 14px">These students have missing or invalid scores:</p>${miss.map(s=>`<div class="kv"><span>${s.name}</span><span class="chip bad">${[['t1','Test 1'],['t2','Test 2'],['ex','Exam']].filter(([c])=>s.sc[c]==null).map(x=>x[1]).join(', ')}</span></div>`).join('')}<div class="acts"><button class="btn" data-act="close">Fix scores</button></div>`);
      D.subs.find(s=>s.live).status='submitted';D.returned=false;render();return toast('Submitted \u2014 Head has been notified. Gradebook is now locked.');}
   case 'allP':{D.students.forEach(s=>s.att_today='P');return render();}
   case 'saveAtt':{D.attAbsent=D.students.filter(s=>s.att_today==='A');D.attSaved=true;render();return toast('Register saved \u00b7 absence alerts queued');}
   case 'insApprove':{D.insights.find(i=>i.id===id).status='approved';render();return toast('Approved \u2014 included in the guardian\u2019s weekly digest');}
   case 'insDismiss':{D.insights.find(i=>i.id===id).status='dismissed';render();return toast('Dismissed \u2014 feedback recorded to improve insights');}
   case 'insAck':{D.insights.find(i=>i.id===id).status='ack';render();return toast('Support plan drafted (teacher-only)');}
   case 'insEdit':{const i=D.insights.find(x=>x.id===id);return modal(`<button class="x" data-act="close">\u00d7</button><h2>Edit message to parent</h2><p class="note" style="margin-bottom:12px">Your edit is what the parent will see.</p><textarea class="in" id="ie">${esc(i.text)}</textarea><div class="acts"><button class="btn line" data-act="close">Cancel</button><button class="btn" data-act="insSave" data-id="${id}">Save &amp; approve</button></div>`);}
   case 'insSave':{const i=D.insights.find(x=>x.id===id);i.text=$('#ie').value;i.status='approved';closeOv();render();return toast('Edited and approved');}
   case 'addNote':{const t=$('#nt').value.trim();if(!t)return;D.students[id].notes.unshift({t,vis:$('#nvis').checked?'shared with guardian':'private'});stuDrawer(id);return toast('Note saved');}
  }
}
document.addEventListener('input',e=>{if(e.target.classList.contains('cell'))onCell(e.target);});
document.addEventListener('keydown',e=>{
  const el=e.target; if(!el.classList||!el.classList.contains('cell')) return;
  const r=+el.dataset.r,c=el.dataset.c;
  if(e.key==='Enter'||e.key==='ArrowDown'){e.preventDefault();const n=$(`.cell[data-r="${r+1}"][data-c="${c}"]`);if(n){n.focus();n.select();}}
  if(e.key==='ArrowUp'){e.preventDefault();const n=$(`.cell[data-r="${r-1}"][data-c="${c}"]`);if(n){n.focus();n.select();}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOv();});


/* command palette */
function openPalette(){
  const items=[];Object.entries(ROLES).forEach(([r,R])=>R.pages.forEach(([k,l,ic])=>items.push({r,k,l,ic,rl:R.label})));
  modal(`<div class="palette"><input id="pq" placeholder="Jump to a page or role\u2026" autocomplete="off"><div class="res" id="pres"></div></div>`);
  $('#ov .modal').className='modal palette'; $('#ov .modal').innerHTML=`<input id="pq" placeholder="Jump to a page or role\u2026" autocomplete="off"><div class="res" id="pres"></div>`;
  let sel=0,list=items;
  const draw=()=>{$('#pres').innerHTML=list.map((i,n)=>`<div class="it ${n===sel?'on':''}" data-pi="${n}">${icon(i.ic)}${i.l}<small>${i.rl}</small></div>`).join('')||'<div class="note" style="padding:14px">No matches</div>';};
  const go2=n=>{const i=list[n];if(!i)return;closeOv();ui.role=i.r;ui.page=i.k;render();window.scrollTo(0,0);};
  draw(); $('#pq').focus();
  $('#pq').oninput=e=>{const q=e.target.value.toLowerCase();list=items.filter(i=>(i.l+' '+i.rl).toLowerCase().includes(q));sel=0;draw();};
  $('#pq').onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(list.length-1,sel+1);draw();e.preventDefault();}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);draw();e.preventDefault();}if(e.key==='Enter')go2(sel);};
  $('#pres').onclick=e=>{const it=e.target.closest('[data-pi]');if(it)go2(+it.dataset.pi);};
}
$('#cmdk').onclick=openPalette;
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();}});

/* live updates from the parent demo */
let lastLive=livePays().length;
setInterval(()=>{
  const n=livePays().length;
  if(n!==lastLive){const added=n>lastLive;lastLive=n;
    if(added){const p=livePays()[n-1];toast(`New payment: ${fm(p.amount)} for ${p.cid==='ama'?'Ama':'Kofi'} via ${p.channel}`);}
    const ae=document.activeElement; if(ui.page!=='flow'&&!(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT'))&&!$('#ov').classList.contains('show')) render();}
},1200);

/* boot (supports #role=teacher&page=grades) */
</script>

  if(r&&ROLES[r[1]]){ui.role=r[1];ui.page=ROLES[r[1]].pages[0][0];} if(p&&PAGES[p[1]]) ui.page=p[1]; render();})();
